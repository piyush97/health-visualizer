# Dependabot configuration for health-visualizer
#
# npm is the canonical package manager for this repository (see the
# `packageManager` field in package.json and MAINTAINING.md). A bun.lock is
# also present in the repo but is intentionally ignored: dependabot only
# manages the npm lockfile (package-lock.json).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
